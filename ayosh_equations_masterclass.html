<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Equations Masterclass ✨</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
            color: #4c1d95;
            overflow-x: hidden;
            font-size: 18px;
        }

        .fancy-title { font-family: 'Fredoka One', cursive; letter-spacing: 1px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #fce7f3; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 10px; }

        /* Animations */
        @keyframes pop-in { 0% { transform: scale(0.8) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); } 50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.8); } }
        @keyframes sticker-pop { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 80% { transform: scale(1.2) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        
        .animate-pop-in { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        .animate-sticker { animation: sticker-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .lesson-card { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; }
        .lesson-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 25px -5px rgba(236, 72, 153, 0.2); }
        .quiz-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .quiz-btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 20px -3px rgba(168, 85, 247, 0.3); }
        
        .math-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #be185d; background: #fdf2f8; padding: 2px 8px; border-radius: 8px; border: 1px solid #fbcfe8; font-size: 1.2em;}
        .step-card { border-left: 5px solid #ec4899; }
    </style>
</head>
<body class="min-h-screen selection:bg-pink-300 selection:text-white pb-20 flex justify-center items-center p-4 md:p-8">

    <div id="app-container" class="max-w-4xl w-full bg-white/95 backdrop-blur-md rounded-[2.5rem] shadow-2xl border-4 border-pink-200 overflow-hidden relative min-h-[750px] flex flex-col">
        <div class="h-4 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 w-full shrink-0"></div>
        <div id="root" class="flex-grow p-6 md:p-10 flex flex-col relative h-full"></div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination); o.type = 'sine'; o.frequency.value = freq;
                        g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                        o.start(); o.stop(audioCtx.currentTime + 0.3);
                    }, i * 100);
                });
            } else if (type === 'incorrect') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // =========================================================
        // FULLY EXPANDED LESSON DATA (Based exactly on uploaded notes)
        // =========================================================
        const lessonsData = [
            {
                id: 'equations_brackets',
                title: 'Basic Brackets',
                icon: 'link',
                color: 'pink',
                ruleHtml: `<p>Multiply the number on the OUTSIDE by EVERY term on the INSIDE.</p>`,
                examples: [
                    {
                        question: "Solve: <span class='math-text'>4(x + 2) = 32</span>",
                        steps: [
                            "<b>Step 1: Expand.</b> Multiply 4 by x, and 4 by 2.<br><span class='math-text block mt-2 text-center'>4x + 8 = 32</span>",
                            "<b>Step 2: Move the +8.</b> It becomes -8.<br><span class='math-text block mt-2 text-center'>4x = 32 - 8</span><br><span class='math-text block mt-2 text-center'>4x = 24</span>",
                            "<b>Step 3: Solve for x.</b> Divide by 4.<br><span class='math-text block mt-2 text-center'>x = 6</span> 🎉"
                        ]
                    }
                ]
            },
            {
                id: 'equations_divide_trick',
                title: 'The "Divide First" Trick!',
                icon: 'zap',
                color: 'amber',
                ruleHtml: `<p>If a number outside the bracket can easily divide the number on the other side, don't expand! Just divide first to make it super easy!</p>`,
                examples: [
                    {
                        question: "Solve: <span class='math-text'>9(6x - 5) = 63</span>",
                        steps: [
                            "<b>Step 1: The Trick!</b> Divide both sides by 9 right now.<br><span class='math-text block mt-2 text-center'>6x - 5 = 63 &divide; 9</span><br><span class='math-text block mt-2 text-center'>6x - 5 = 7</span>",
                            "<b>Step 2: Move the -5.</b> Add 5 to both sides.<br><span class='math-text block mt-2 text-center'>6x = 7 + 5</span><br><span class='math-text block mt-2 text-center'>6x = 12</span>",
                            "<b>Step 3: Solve for x.</b> Divide by 6.<br><span class='math-text block mt-2 text-center'>x = 2</span> ⚡"
                        ]
                    }
                ]
            },
            {
                id: 'equations_double_brackets',
                title: 'Double Brackets (Advanced)',
                icon: 'braces',
                color: 'rose',
                ruleHtml: `<p>Expand BOTH brackets separately, then combine the 'x's together and the numbers together!</p>`,
                examples: [
                    {
                        question: "Solve: <span class='math-text'>3(x + 2) + 5(x + 4) = 90</span>",
                        steps: [
                            "<b>Step 1: Expand both brackets.</b><br><span class='math-text block mt-2 text-center'>3x + 6 + 5x + 20 = 90</span>",
                            "<b>Step 2: Collect like terms.</b> Add the x's (3x+5x) and numbers (6+20).<br><span class='math-text block mt-2 text-center'>8x + 26 = 90</span>",
                            "<b>Step 3: Move the +26.</b><br><span class='math-text block mt-2 text-center'>8x = 90 - 26</span><br><span class='math-text block mt-2 text-center'>8x = 64</span>",
                            "<b>Step 4: Solve for x.</b> Divide by 8.<br><span class='math-text block mt-2 text-center'>x = 8</span> 🏆"
                        ]
                    }
                ]
            },
            {
                id: 'equations_fractions',
                title: 'Fractions (Multiplication)',
                icon: 'divide-circle',
                color: 'purple',
                ruleHtml: `<p>To get rid of a fraction, MULTIPLY both sides by the denominator (bottom number)!</p>`,
                examples: [
                    {
                        question: "Solve: <span class='math-text'>&frac23;x = 8</span>",
                        steps: [
                            "<b>Step 1: Get rid of the 3.</b> Multiply both sides by 3.<br><span class='math-text block mt-2 text-center'>2x = 8 &times; 3</span><br><span class='math-text block mt-2 text-center'>2x = 24</span>",
                            "<b>Step 2: Solve for x.</b> Divide by 2.<br><span class='math-text block mt-2 text-center'>x = 12</span> 🌟"
                        ]
                    }
                ]
            },
            {
                id: 'equations_adv_fractions',
                title: 'Advanced Fractions (+ & -)',
                icon: 'layers',
                color: 'emerald',
                ruleHtml: `<p>If there is a loose number next to the fraction, move it to the other side FIRST before you deal with the fraction!</p>`,
                examples: [
                    {
                        question: "Solve: <span class='math-text'>&frac14;y + 6 = 9</span>",
                        steps: [
                            "<b>Step 1: Move the +6.</b> Subtract 6 from 9.<br><span class='math-text block mt-2 text-center'>&frac14;y = 9 - 6</span><br><span class='math-text block mt-2 text-center'>&frac14;y = 3</span>",
                            "<b>Step 2: Get rid of the 4.</b> Multiply both sides by 4.<br><span class='math-text block mt-2 text-center'>y = 3 &times; 4</span>",
                            "<b>Final Answer:</b> <span class='math-text'>y = 12</span> 🌿"
                        ]
                    }
                ]
            },
            {
                id: 'equations_both_sides',
                title: 'Unknowns on Both Sides',
                icon: 'scale',
                color: 'indigo',
                ruleHtml: `<p>Move all the letters to one side, and all the numbers to the other. Change the sign when crossing the equals!</p>`,
                examples: [
                    {
                        question: "Solve: <span class='math-text'>5x - 2 = 2x + 10</span>",
                        steps: [
                            "<b>Step 1: Move the 2x.</b> It becomes -2x.<br><span class='math-text block mt-2 text-center'>5x - 2x - 2 = 10</span><br><span class='math-text block mt-2 text-center'>3x - 2 = 10</span>",
                            "<b>Step 2: Move the -2.</b> It becomes +2.<br><span class='math-text block mt-2 text-center'>3x = 10 + 2</span><br><span class='math-text block mt-2 text-center'>3x = 12</span>",
                            "<b>Step 3: Solve for x.</b><br><span class='math-text block mt-2 text-center'>x = 4</span> 🎯"
                        ]
                    }
                ]
            }
        ];

        // =========================================================
        // ENHANCED PRACTICE GAME (No Emojis in Answers!)
        // =========================================================
        const quizData = [
            {
                q: "What is the best FIRST step to solve 9(6x - 5) = 63?",
                opts: [
                    { t: "Divide both sides by 9", c: true },
                    { t: "Expand the bracket to 54x - 45", c: false },
                    { t: "Add 5 to 63", c: false }
                ],
                exp: "Use the Divide Trick! 63 divides perfectly by 9 to make 7. It makes the equation 6x - 5 = 7, which is super easy!"
            },
            {
                q: "Solve the double bracket equation: 3(x + 2) + 5(x + 4) = 90",
                opts: [
                    { t: "x = 10", c: false },
                    { t: "x = 6", c: false },
                    { t: "x = 8", c: true }
                ],
                exp: "Expand: 3x + 6 + 5x + 20 = 90. Combine: 8x + 26 = 90. Move 26: 8x = 64. Divide by 8: x = 8."
            },
            {
                q: "Solve the advanced fraction equation: (1/4)y + 6 = 9",
                opts: [
                    { t: "y = 12", c: true },
                    { t: "y = 3", c: false },
                    { t: "y = 4", c: false }
                ],
                exp: "Move the +6 first! (1/4)y = 3. Then multiply both sides by 4 to get rid of the fraction. y = 12."
            },
            {
                q: "Solve the equation: 5(2y - 2) - 4(y - 1) = 48",
                opts: [
                    { t: "y = 9", c: true },
                    { t: "y = 8", c: false },
                    { t: "y = 10", c: false }
                ],
                exp: "Expand carefully: 10y - 10 - 4y + 4 = 48. Combine terms: 6y - 6 = 48. Move -6: 6y = 54. Divide: y = 9."
            },
            {
                q: "If a closed circle is on a number line at -3 and points to the right, what is the inequality?",
                opts: [
                    { t: "x is greater than or equal to -3", c: true },
                    { t: "x is greater than -3", c: false },
                    { t: "x is less than or equal to -3", c: false }
                ],
                exp: "A CLOSED circle means it IS equal to. Pointing right means greater than! So, x >= -3."
            },
            {
                q: "Solve the equation with unknowns on both sides: (4/3)t - 5/12 = 1/4",
                opts: [
                    { t: "t = 1/3", c: false },
                    { t: "t = 1/2", c: true },
                    { t: "t = 2", c: false }
                ],
                exp: "Move -5/12 to get (4/3)t = 1/4 + 5/12. This is 3/12 + 5/12 = 8/12 = 2/3. So (4/3)t = 2/3. t = 1/2."
            }
        ];

        const motivationalQuotes = ["You're a Math Star! ⭐", "Unstoppable! 🚀", "Genius at work! 🧠", "Flawless Logic! 🎀"];
        const stickers = ["✨", "🌟", "🌸", "👑", "💖", "🎯", "🎉"];

        let currentMode = 'menu';
        let completedLessons = [];
        let currentLessonIndex = -1;
        let currentExampleIndex = 0;
        let currentStepIndex = 0;
        let currentQIndex = 0;
        let score = 0;
        let userAnswers = [];
        let isAnswering = false;

        const root = document.getElementById('root');

        function renderMenu() {
            let html = `
                <div class="text-center animate-pop-in flex flex-col h-full justify-center">
                    <div class="w-28 h-28 bg-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl border-4 border-pink-300 relative z-10 animate-float">
                        <i data-lucide="move-horizontal" class="w-14 h-14 text-pink-500"></i>
                    </div>
                    <h1 class="fancy-title text-5xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-indigo-500 mb-4 pb-2">
                        Equations Masterclass
                    </h1>
                    <p class="text-purple-700 font-bold text-xl mb-10 max-w-lg mx-auto bg-white/60 p-4 rounded-2xl shadow-sm border border-pink-100">
                        Master double brackets, tricky fractions, and the divide-first trick! 🎀
                    </p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl mx-auto">
                        <button onclick="showLessonMenu()" class="p-6 bg-gradient-to-br from-pink-100 to-purple-100 border-4 border-pink-300 hover:border-pink-500 rounded-3xl shadow-lg transform transition hover:-translate-y-2 group">
                            <i data-lucide="book-open-check" class="w-12 h-12 text-pink-500 mx-auto mb-3 group-hover:scale-110 transition-transform"></i>
                            <h2 class="text-2xl font-black text-purple-800 mb-1">The Masterclass</h2>
                            <p class="text-sm font-bold text-purple-600">6 Step-by-step topics!</p>
                        </button>
                        
                        <button onclick="startPracticeGame()" class="p-6 bg-gradient-to-br from-indigo-100 to-cyan-100 border-4 border-indigo-300 hover:border-indigo-500 rounded-3xl shadow-lg transform transition hover:-translate-y-2 group">
                            <i data-lucide="gamepad-2" class="w-12 h-12 text-indigo-500 mx-auto mb-3 group-hover:scale-110 transition-transform"></i>
                            <h2 class="text-2xl font-black text-indigo-900 mb-1">Practice Game</h2>
                            <p class="text-sm font-bold text-indigo-700">Test your knowledge!</p>
                        </button>
                    </div>
                </div>
            `;
            root.innerHTML = html;
            lucide.createIcons();
        }

        function showLessonMenu() {
            playSound('pop');
            let html = `
                <div class="flex flex-col h-full animate-pop-in">
                    <div class="flex items-center gap-4 border-b-4 border-pink-200 pb-4 mb-6 shrink-0">
                        <button onclick="playSound('pop'); renderMenu()" class="w-12 h-12 bg-white hover:bg-pink-50 rounded-full flex items-center justify-center text-pink-600 shadow-sm border-2 border-pink-200 transition-colors">
                            <i data-lucide="arrow-left" class="w-6 h-6"></i>
                        </button>
                        <h2 class="fancy-title text-4xl text-pink-600">Choose a Lesson</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto custom-scrollbar pr-2 pb-4">
            `;

            lessonsData.forEach((lesson, index) => {
                let isCompleted = completedLessons.includes(lesson.id);
                html += `
                    <div onclick="startLesson(${index})" class="bg-white border-4 border-${lesson.color}-200 hover:border-${lesson.color}-400 p-6 rounded-3xl flex items-center justify-between cursor-pointer transform transition hover:-translate-y-1 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-${lesson.color}-50 rounded-xl flex items-center justify-center shadow-inner shrink-0">
                                <i data-lucide="${lesson.icon}" class="w-6 h-6 text-${lesson.color}-500"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-black text-xl text-purple-900">${lesson.title}</h3>
                                <p class="text-sm font-bold text-${lesson.color}-600">${isCompleted ? 'Completed! 🎉' : 'Click to learn'}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            root.innerHTML = html;
            lucide.createIcons();
        }

        window.startLesson = function(index) {
            playSound('pop');
            currentLessonIndex = index;
            currentExampleIndex = 0;
            currentStepIndex = 0;
            renderLesson();
        }

        function renderLesson() {
            const lesson = lessonsData[currentLessonIndex];
            root.innerHTML = `
                <div class="flex flex-col h-full animate-pop-in">
                    <div class="flex items-center gap-4 border-b-4 border-${lesson.color}-200 pb-4 mb-6 shrink-0">
                        <button onclick="playSound('pop'); showLessonMenu()" class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-${lesson.color}-600 shadow-sm border-2 border-${lesson.color}-200 hover:bg-${lesson.color}-50">
                            <i data-lucide="arrow-left" class="w-6 h-6"></i>
                        </button>
                        <h2 class="fancy-title text-3xl md:text-4xl text-${lesson.color}-600">${lesson.title}</h2>
                    </div>

                    <div class="flex-grow overflow-y-auto custom-scrollbar pr-2 pb-32" id="lesson-scroll-area">
                        <div class="bg-white p-6 rounded-3xl border-4 border-${lesson.color}-100 mb-8 shadow-sm relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-4 opacity-10"><i data-lucide="book" class="w-24 h-24"></i></div>
                            <h3 class="font-black text-2xl text-${lesson.color}-700 mb-4 flex items-center gap-2">
                                <i data-lucide="wand-2" class="w-6 h-6"></i> Theory Guide
                            </h3>
                            <div class="text-purple-900 font-bold text-lg">
                                ${lesson.ruleHtml}
                            </div>
                        </div>
                        <div id="examples-container"></div>
                    </div>

                    <div class="absolute bottom-6 left-6 right-6 pt-4 bg-white/95 backdrop-blur-md z-10 rounded-t-3xl border-t-2 border-gray-100" id="controls-container">
                        <button onclick="startExample()" class="w-full py-5 bg-gradient-to-r from-${lesson.color}-400 to-purple-500 text-white rounded-[2rem] font-black text-2xl shadow-xl transform transition active:scale-95 flex items-center justify-center gap-3 animate-pulse-glow">
                            Load Example <i data-lucide="play" class="w-7 h-7"></i>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        window.startExample = function() {
            playSound('pop');
            const lesson = lessonsData[currentLessonIndex];
            const example = lesson.examples[currentExampleIndex];
            currentStepIndex = 0;

            const container = document.getElementById('examples-container');
            const exDiv = document.createElement('div');
            exDiv.className = "mb-8 animate-pop-in";
            exDiv.innerHTML = `
                <div class="bg-slate-800 text-white p-6 rounded-t-3xl border-b-8 border-pink-500">
                    <h4 class="font-black text-pink-400 text-sm uppercase tracking-wider mb-2">Example ${currentExampleIndex + 1}</h4>
                    <p class="text-2xl font-bold leading-relaxed">${example.question}</p>
                </div>
                <div id="steps-container-${currentExampleIndex}" class="bg-white border-4 border-gray-200 border-t-0 rounded-b-3xl p-6 space-y-4 shadow-sm">
                </div>
            `;
            container.appendChild(exDiv);
            exDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            updateControlsToStep();
        }

        function updateControlsToStep() {
            const lesson = lessonsData[currentLessonIndex];
            const example = lesson.examples[currentExampleIndex];
            const controls = document.getElementById('controls-container');

            if (currentStepIndex < example.steps.length) {
                controls.innerHTML = `
                    <button onclick="revealNextStep()" class="w-full py-5 bg-pink-50 border-4 border-pink-400 text-pink-600 hover:bg-pink-100 rounded-[2rem] font-black text-2xl shadow-sm transform transition active:scale-95 flex items-center justify-center gap-3">
                        Reveal Step ${currentStepIndex + 1} ✨
                    </button>
                `;
            } else {
                playSound('correct');
                if (currentExampleIndex < lesson.examples.length - 1) {
                    controls.innerHTML = `
                        <button onclick="nextExample()" class="w-full py-5 bg-gradient-to-r from-purple-400 to-indigo-500 text-white rounded-[2rem] font-black text-2xl shadow-xl transform transition active:scale-95 flex items-center justify-center gap-3 animate-pulse-glow">
                            Next Example <i data-lucide="arrow-right" class="w-7 h-7"></i>
                        </button>
                    `;
                } else {
                    if (!completedLessons.includes(lesson.id)) completedLessons.push(lesson.id);
                    controls.innerHTML = `
                        <button onclick="playSound('pop'); showLessonMenu()" class="w-full py-5 bg-gradient-to-r from-green-400 to-emerald-500 text-white rounded-[2rem] font-black text-2xl shadow-xl transform transition active:scale-95 flex items-center justify-center gap-3 animate-pulse-glow">
                            Lesson Complete! Return 📚
                        </button>
                    `;
                }
            }
            lucide.createIcons();
        }

        window.revealNextStep = function() {
            playSound('pop');
            const lesson = lessonsData[currentLessonIndex];
            const example = lesson.examples[currentExampleIndex];
            const stepText = example.steps[currentStepIndex];
            
            const stepsContainer = document.getElementById(`steps-container-${currentExampleIndex}`);
            const stepDiv = document.createElement('div');
            stepDiv.className = `step-card bg-purple-50 p-5 rounded-2xl text-purple-900 font-bold text-xl animate-pop-in`;
            stepDiv.innerHTML = stepText;
            stepsContainer.appendChild(stepDiv);
            
            const scrollArea = document.getElementById('lesson-scroll-area');
            scrollArea.scrollTop = scrollArea.scrollHeight;

            currentStepIndex++;
            updateControlsToStep();
        }

        window.nextExample = function() {
            playSound('pop'); currentExampleIndex++; startExample();
        }

        // --- PRACTICE GAME FLOW ---
        window.startPracticeGame = function() {
            initAudio(); playSound('pop');
            currentQIndex = 0; score = 0; userAnswers = [];
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const q = quizData[currentQIndex];
            isAnswering = false;
            
            let progressHtml = `
                <div class="flex justify-between items-center border-b-4 border-indigo-200 pb-4 mb-6 shrink-0">
                    <div class="flex items-center gap-2 font-black text-xl text-indigo-600 uppercase tracking-widest">
                        <i data-lucide="gamepad-2" class="w-6 h-6"></i> Practice
                    </div>
                    <div class="w-1/2 bg-gray-200 rounded-full h-3 mx-4">
                        <div class="bg-gradient-to-r from-indigo-400 to-pink-500 h-3 rounded-full transition-all duration-500" style="width: ${(currentQIndex / quizData.length) * 100}%"></div>
                    </div>
                    <span class="font-black text-indigo-700 bg-indigo-100 px-4 py-1.5 rounded-full text-lg shadow-sm">
                        ${currentQIndex + 1} / ${quizData.length}
                    </span>
                </div>
            `;

            let optionsHtml = q.opts.map((opt, idx) => `
                <button id="opt-${idx}" onclick="handleQuizAnswer(${idx}, ${opt.c})" class="quiz-btn w-full text-left p-6 rounded-3xl border-4 border-indigo-200 bg-white font-black text-purple-900 hover:bg-indigo-50 hover:border-indigo-400 text-2xl shadow-sm">
                    ${opt.t}
                </button>
            `).join('');

            root.innerHTML = `
                <div class="space-y-6 w-full animate-pop-in flex flex-col h-full">
                    ${progressHtml}
                    <div class="bg-indigo-50 p-8 rounded-[2rem] border-4 border-indigo-200 shrink-0 shadow-inner">
                        <h2 class="text-2xl md:text-3xl font-black text-indigo-900 leading-snug">${q.q}</h2>
                    </div>
                    <div class="space-y-4 flex-grow overflow-y-auto custom-scrollbar pt-2" id="options-container">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-container" class="hidden shrink-0 mt-2"></div>
                </div>
            `;
            lucide.createIcons();
        }

        window.handleQuizAnswer = function(idx, isCorrect) {
            if (isAnswering) return;
            isAnswering = true;
            const q = quizData[currentQIndex];
            const feedbackContainer = document.getElementById('feedback-container');
            const clickedBtn = document.getElementById(`opt-${idx}`);

            userAnswers.push({ q: q.q, correct: isCorrect, exp: q.exp, selected: q.opts[idx].t });

            document.querySelectorAll('#options-container button').forEach(btn => {
                btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed');
            });

            if (isCorrect) {
                score++; playSound('correct');
                clickedBtn.className = "w-full text-left p-6 rounded-3xl border-4 font-black bg-green-100 border-green-500 text-green-900 scale-[1.02] shadow-xl text-2xl";
                
                let randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
                let randomSticker = stickers[Math.floor(Math.random() * stickers.length)];
                
                feedbackContainer.innerHTML = `
                    <div class="p-5 rounded-3xl border-4 bg-green-50 border-green-400 animate-pop-in shadow-inner relative overflow-hidden">
                        <div class="absolute right-4 top-2 text-6xl opacity-30 animate-sticker">${randomSticker}</div>
                        <p class="font-black text-2xl text-green-700 mb-1 relative z-10">${randomQuote}</p>
                        <p class="text-lg font-bold text-green-900 relative z-10 bg-white/60 p-2 rounded-lg">${q.exp}</p>
                    </div>
                `;
            } else {
                playSound('incorrect');
                clickedBtn.className = "w-full text-left p-6 rounded-3xl border-4 font-bold bg-red-100 border-red-500 text-red-900 scale-[0.98] text-2xl opacity-60";
                const correctIdx = q.opts.findIndex(o => o.c);
                const correctBtn = document.getElementById(`opt-${correctIdx}`);
                correctBtn.classList.remove('opacity-50'); correctBtn.classList.add('bg-green-100', 'border-green-400', 'text-green-900', 'font-black', 'border-4');
                
                feedbackContainer.innerHTML = `
                    <div class="p-5 rounded-3xl border-4 bg-red-50 border-red-300 animate-pop-in shadow-inner">
                        <p class="font-black text-2xl text-red-700 mb-1">Let's check the rule! 🛑</p>
                        <p class="text-lg font-bold text-red-900 bg-white/60 p-2 rounded-lg">${q.exp}</p>
                    </div>
                `;
            }

            feedbackContainer.classList.remove('hidden');
            
            setTimeout(() => {
                if (currentQIndex < quizData.length - 1) { currentQIndex++; renderQuizQuestion(); } 
                else { renderReport(); }
            }, 5000);
        }

        function renderReport() {
            let message = score === quizData.length ? "FLAWLESS! YOU ARE A MATH GENIUS! 👑💯" : "Great practice! Review your answers below! 📚";
            
            let reportHtml = userAnswers.map((ans, i) => `
                <div class="bg-white p-6 rounded-3xl border-4 ${ans.correct ? 'border-green-200' : 'border-red-200'} mb-4 text-left shadow-sm">
                    <p class="font-black text-purple-900 text-xl mb-3"><span class="${ans.correct ? 'text-green-500' : 'text-red-500'} mr-2">${ans.correct ? '✅' : '❌'}</span> Q${i + 1}: ${ans.q}</p>
                    <div class="bg-gray-50 rounded-2xl p-4 mb-3 text-lg border-2 border-gray-100">
                        <span class="text-gray-400 text-sm uppercase font-black block mb-1">You answered:</span>
                        <span class="${ans.correct ? 'text-green-600 font-black' : 'text-red-600 font-bold line-through'}">${ans.selected}</span>
                    </div>
                    <p class="text-lg text-indigo-900 bg-indigo-50 p-4 rounded-2xl border-2 border-indigo-100 font-bold"><strong>Rule:</strong> ${ans.exp}</p>
                </div>
            `).join('');

            root.innerHTML = `
                <div class="flex flex-col h-full w-full animate-pop-in text-center">
                    <div class="text-center mb-6 shrink-0">
                        <div class="w-24 h-24 mx-auto bg-indigo-100 rounded-full flex items-center justify-center mb-4 shadow-md border-4 border-white"><i data-lucide="award" class="w-12 h-12 text-yellow-500"></i></div>
                        <h3 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-pink-500">Practice Complete!</h3>
                    </div>

                    <div class="bg-indigo-50 w-full p-6 rounded-3xl border-4 border-indigo-200 text-center mb-6 shrink-0 shadow-inner">
                        <p class="text-lg text-indigo-800 font-black uppercase tracking-wider mb-2">Final Score</p>
                        <p class="text-6xl font-black text-indigo-600 my-2">${score} <span class="text-4xl text-indigo-400">/ ${quizData.length}</span></p>
                        <p class="text-xl text-purple-600 font-bold mt-2">${message}</p>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto custom-scrollbar pr-2 mb-6">
                        <h4 class="font-black text-pink-500 text-lg uppercase tracking-wider mb-4 text-center border-b-4 border-pink-100 pb-2">Detailed Report</h4>
                        ${reportHtml}
                    </div>
                    
                    <div class="shrink-0 flex gap-4">
                        <button onclick="renderMenu()" class="w-full py-5 bg-white border-4 border-purple-200 text-purple-600 hover:bg-purple-50 rounded-[2rem] font-black text-xl shadow-sm transform transition active:scale-95 flex items-center justify-center gap-3">
                            <i data-lucide="home" class="w-6 h-6"></i> Back to Menu
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        renderMenu();
    </script>
</body>
</html>
