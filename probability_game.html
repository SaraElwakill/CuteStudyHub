<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probability Playground 🎲🎀</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Nunito', sans-serif; }

        /* Magical Animations */
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        @keyframes pop-in { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pop-in { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Custom Button Hover */
        .quiz-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .quiz-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); /* indigo-500 shadow */
        }

        /* Drag and Drop Custom Styles */
        .word-bank-item { cursor: pointer; transition: all 0.2s; }
        .word-bank-item.selected {
            background-color: #e0e7ff; /* indigo-100 */
            border-color: #6366f1; /* indigo-500 */
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
        .drop-slot { transition: all 0.2s; min-height: 3rem; }
        .drop-slot.active-target {
            background-color: #eef2ff; /* indigo-50 */
            border-color: #818cf8; /* indigo-400 */
            border-style: dashed;
        }
        
        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #e0e7ff; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }

        /* Print Styles for the Report */
        @media print {
            body { background-color: white !important; }
            #app-container { 
                box-shadow: none !important; 
                border: none !important; 
                max-width: 100% !important; 
                min-height: auto !important;
            }
            .no-print { display: none !important; }
            .custom-scrollbar { overflow: visible !important; max-height: none !important; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen text-indigo-900 flex items-center justify-center p-4 selection:bg-indigo-300 selection:text-white">

    <!-- Game Container -->
    <div id="app-container" class="max-w-2xl w-full bg-white/90 backdrop-blur-sm rounded-[2.5rem] shadow-2xl border-4 border-indigo-200 overflow-hidden relative min-h-[600px] flex flex-col print:bg-white">
        <!-- Top decorative bar -->
        <div class="h-4 bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 w-full shrink-0 no-print"></div>

        <!-- Dynamic Content Root -->
        <div id="root" class="flex-grow p-6 md:p-8 flex flex-col justify-center"></div>
    </div>

    <script>
        // --- PROBABILITY QUESTIONS DATABASE (Chapter 12) ---
        const quizData = [
            {
                type: 'mcq',
                q: "The probability scale goes from 0 to 1. What does a probability of 0 mean? 📉",
                opts: [
                    { t: "It is certain to happen", c: false },
                    { t: "It is impossible 🚫", c: true },
                    { t: "It is very likely", c: false }
                ],
                exp: "0 means an outcome is impossible, while 1 means that an outcome is absolutely certain!"
            },
            {
                type: 'mcq',
                q: "The probability that the school bus arrives on time is 1/3. What is the probability it will NOT arrive on time? 🚌",
                opts: [
                    { t: "1/3", c: false },
                    { t: "2/3 ⏱️", c: true },
                    { t: "0", c: false }
                ],
                exp: "This is a complementary event! P(not A) = 1 - P(A). So, 1 - 1/3 = 2/3."
            },
            {
                type: 'dnd',
                q: "Tap a term, then tap a box to match the Probability definitions! 📚",
                pairs: [
                    { term: "Experimental", def: "An estimate based on the outcomes of several repetitions (relative frequency)." },
                    { term: "Theoretical", def: "Number of favourable events divided by total possible outcomes." },
                    { term: "Complement", def: "The event 'not A' occurring. P(A) + P(not A) = 1." }
                ],
                hint: "Theoretical is what SHOULD happen in theory, Experimental is what ACTUALLY happens when you test it!"
            },
            {
                type: 'mcq',
                q: "A bag holds red, yellow, and blue counters. P(red) = 0.2 and P(yellow) = 0.35. What is P(blue)? 🔵",
                opts: [
                    { t: "0.55", c: false },
                    { t: "0.45 🎯", c: true },
                    { t: "0.80", c: false }
                ],
                exp: "All mutually exclusive probabilities must add up to 1! P(blue) = 1 - (0.2 + 0.35) = 1 - 0.55 = 0.45."
            },
            {
                type: 'mcq',
                q: "What does it mean if a dice or a spinner is 'fair'? 🎲",
                opts: [
                    { t: "It is equally likely to land on any side or face ✨", c: true },
                    { t: "It always rolls a 6", c: false },
                    { t: "It has nice colors", c: false }
                ],
                exp: "A fair dice means every single number has the exact same theoretical probability of occurring (1/6)!"
            },
            {
                type: 'dnd',
                q: "Calculate the probability of NO rain, given the probability of rain! 🌧️",
                pairs: [
                    { term: "0.5", def: "P(rain) = 0.5. P(no rain) =" },
                    { term: "0.12", def: "P(rain) = 0.88. P(no rain) =" },
                    { term: "0.05", def: "P(rain) = 0.95. P(no rain) =" }
                ],
                hint: "Remember: P(rain) + P(no rain) always equals 1.0! Just subtract P(rain) from 1."
            }
        ];

        const praises = ["Math Genius! 🧮", "Probability Queen! 👑", "Perfect Calculation! ✨", "Brilliant! 💡"];

        // --- GAME STATE ---
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        let dndState = { bank: [], slots: [], selectedWord: null };
        let audioCtx = null;
        let isAnswering = false;

        const root = document.getElementById('root');

        // --- AUDIO ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'incorrect') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // --- VIEWS ---
        function renderStart() {
            root.innerHTML = `
                <div class="text-center space-y-6 flex flex-col items-center animate-pop-in">
                    <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center animate-float shadow-inner border-4 border-white">
                        <i data-lucide="dice-5" class="w-12 h-12 text-indigo-500"></i>
                    </div>
                    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500">
                        Probability Playground 🎲
                    </h1>
                    <p class="text-lg text-indigo-700 font-medium px-4">
                        Master Chapter 12: Complementary Events, Theoretical vs. Experimental, and Fair Chances!
                    </p>
                    <div class="pt-4 w-full px-8">
                        <button onclick="startGame()" class="w-full py-4 px-6 bg-gradient-to-r from-indigo-400 to-purple-400 hover:from-indigo-500 hover:to-purple-500 text-white rounded-2xl font-bold text-xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2">
                            <i data-lucide="sparkles" class="w-6 h-6"></i> Let's Calculate!
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        window.startGame = function() {
            initAudio();
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            renderQuestion();
        }

        window.showHint = function() {
            initAudio(); playSound('pop');
            const q = quizData[currentQuestionIndex];
            const hintBox = document.getElementById('hint-box');
            hintBox.innerHTML = `<p class="text-sm text-pink-700 font-bold flex items-start text-left gap-2"><i data-lucide="lightbulb" class="w-5 h-5 shrink-0"></i> ${q.hint}</p>`;
            hintBox.classList.remove('hidden');
            document.getElementById('hint-btn').classList.add('hidden');
            lucide.createIcons();
        }

        function renderQuestion() {
            isAnswering = false;
            const q = quizData[currentQuestionIndex];
            
            let progressHtml = `
                <div class="flex justify-between items-center border-b-2 border-indigo-100 pb-4 shrink-0">
                    <div class="flex items-center gap-2 font-bold text-indigo-600">
                        <i data-lucide="pie-chart" class="w-5 h-5"></i> Math Genius
                    </div>
                    <span class="font-bold text-indigo-500 bg-indigo-100 px-3 py-1 rounded-full text-sm">
                        Q ${currentQuestionIndex + 1} / ${quizData.length}
                    </span>
                </div>
            `;

            if (q.type === 'mcq') renderMCQ(progressHtml, q);
            else if (q.type === 'dnd') { initDnDState(q); renderDnD(progressHtml, q); }
        }

        // --- MCQ LOGIC ---
        function renderMCQ(progressHtml, q) {
            let optionsHtml = q.opts.map((opt, idx) => `
                <button id="opt-${idx}" onclick="handleMCQ(${idx}, ${opt.c})" class="quiz-btn w-full text-left p-4 rounded-2xl border-2 border-indigo-100 bg-white font-medium text-indigo-800 hover:bg-indigo-50 hover:border-indigo-300">
                    ${opt.t}
                </button>
            `).join('');

            root.innerHTML = `
                <div class="space-y-6 w-full animate-pop-in flex flex-col h-full">
                    ${progressHtml}
                    <div class="bg-purple-50 p-5 rounded-2xl border-2 border-purple-100 shrink-0">
                        <h2 class="text-lg md:text-xl font-bold text-purple-900">${q.q}</h2>
                    </div>
                    <div class="space-y-3 flex-grow overflow-y-auto custom-scrollbar" id="options-container">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-container" class="hidden mt-4 shrink-0"></div>
                </div>
            `;
            lucide.createIcons();
        }

        window.handleMCQ = function(idx, isCorrect) {
            if(isAnswering) return;
            isAnswering = true;
            
            const q = quizData[currentQuestionIndex];
            const feedbackContainer = document.getElementById('feedback-container');
            const clickedBtn = document.getElementById(`opt-${idx}`);
            
            userAnswers.push({ q: q.q, correct: isCorrect, exp: q.exp });

            document.querySelectorAll('#options-container button').forEach(btn => {
                btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed');
            });

            if (isCorrect) {
                score++; playSound('correct');
                clickedBtn.className = "w-full text-left p-4 rounded-2xl border-2 font-bold bg-green-100 border-green-400 text-green-800 scale-[1.02] shadow-md transition-all";
                let praise = praises[Math.floor(Math.random() * praises.length)];
                feedbackContainer.innerHTML = `<div class="p-4 rounded-2xl border-2 bg-green-50 border-green-300 animate-pop-in"><p class="font-bold text-lg text-green-700 mb-1 flex items-center gap-2"><i data-lucide="check-circle" class="w-5 h-5"></i> ${praise}</p><p class="text-sm font-semibold text-green-800">${q.exp}</p></div>`;
            } else {
                playSound('incorrect');
                clickedBtn.className = "w-full text-left p-4 rounded-2xl border-2 font-bold bg-red-100 border-red-400 text-red-800 scale-[0.98] transition-all";
                const correctIdx = q.opts.findIndex(o => o.c);
                const correctBtn = document.getElementById(`opt-${correctIdx}`);
                correctBtn.classList.remove('opacity-50'); correctBtn.classList.add('bg-green-50', 'border-green-300', 'text-green-800');
                feedbackContainer.innerHTML = `<div class="p-4 rounded-2xl border-2 bg-red-50 border-red-300 animate-pop-in"><p class="font-bold text-lg text-red-700 mb-1 flex items-center gap-2"><i data-lucide="x-circle" class="w-5 h-5"></i> Oopsie!</p><p class="text-sm font-semibold text-red-800">${q.exp}</p></div>`;
            }

            feedbackContainer.classList.remove('hidden'); lucide.createIcons();
            setTimeout(nextQuestion, 4000);
        }

        // --- TAP & DROP LOGIC ---
        function initDnDState(q) {
            let terms = q.pairs.map(p => p.term);
            dndState.bank = terms.sort(() => Math.random() - 0.5);
            dndState.slots = q.pairs.map(p => ({ def: p.def, filledWith: null, correctTerm: p.term }));
            dndState.selectedWord = null;
        }

        function renderDnD(progressHtml, q) {
            let bankHtml = dndState.bank.length === 0 
                ? `<p class="text-center text-sm font-bold text-gray-400 italic py-2 w-full">All matched! Tap Check Matches! 🎀</p>`
                : dndState.bank.map(word => `<div onclick="selectWord('${word}')" class="word-bank-item inline-block px-4 py-2 bg-white border-2 border-indigo-300 text-indigo-700 font-bold rounded-xl shadow-sm ${dndState.selectedWord === word ? 'selected' : ''}">${word}</div>`).join('');

            let slotsHtml = dndState.slots.map((slot, index) => `
                <div class="bg-gray-50 rounded-xl p-3 border-2 border-gray-200 flex flex-col md:flex-row gap-3 items-center text-sm font-medium text-indigo-900">
                    <div class="flex-grow text-center md:text-left">${slot.def}</div>
                    <div onclick="tapSlot(${index})" class="drop-slot w-full md:w-40 bg-white border-2 border-gray-300 rounded-xl flex items-center justify-center cursor-pointer shrink-0 ${dndState.selectedWord && !slot.filledWith ? 'active-target' : ''}">
                        ${slot.filledWith ? `<span class="font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg w-full text-center h-full flex items-center justify-center">${slot.filledWith}</span>` : `<span class="text-gray-400 text-xs uppercase tracking-widest">Tap to place</span>`}
                    </div>
                </div>
            `).join('');

            let submitBtn = `<button onclick="checkDnD()" class="w-full py-3 mt-4 bg-gradient-to-r from-indigo-400 to-purple-400 text-white rounded-xl font-bold shadow-md transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2" ${dndState.bank.length > 0 ? 'disabled' : ''}>Check Matches <i data-lucide="sparkles" class="w-5 h-5"></i></button>`;

            root.innerHTML = `
                <div class="space-y-4 w-full animate-pop-in flex flex-col h-full">
                    ${progressHtml}
                    <div class="bg-purple-50 p-4 rounded-2xl border-2 border-purple-100 shrink-0 text-center relative">
                        <h2 class="text-lg font-bold text-purple-900">${q.q}</h2>
                        ${q.hint ? `<button id="hint-btn" onclick="showHint()" class="mt-2 text-sm font-bold text-pink-600 hover:text-pink-700 inline-flex items-center gap-1 transition-colors"><i data-lucide="help-circle" class="w-4 h-4"></i> Need a hint?</button>
                        <div id="hint-box" class="hidden bg-pink-50 border-2 border-pink-200 rounded-xl p-3 mt-3 animate-pop-in shadow-sm"></div>` : ''}
                    </div>
                    <div class="bg-white p-3 rounded-2xl border-2 border-indigo-200 shadow-inner min-h-[4rem] flex flex-wrap gap-2 justify-center items-center shrink-0 transition-all">${bankHtml}</div>
                    <div class="space-y-2 flex-grow overflow-y-auto custom-scrollbar">${slotsHtml}</div>
                    <div class="shrink-0" id="dnd-footer">${submitBtn}</div>
                </div>
            `;
            lucide.createIcons();
        }

        window.selectWord = function(word) { playSound('pop'); dndState.selectedWord = dndState.selectedWord === word ? null : word; reRenderDnD(); }
        window.tapSlot = function(slotIndex) {
            let slot = dndState.slots[slotIndex];
            if (slot.filledWith) { playSound('pop'); dndState.bank.push(slot.filledWith); slot.filledWith = null; dndState.selectedWord = null; reRenderDnD(); return; }
            if (dndState.selectedWord && !slot.filledWith) { playSound('pop'); slot.filledWith = dndState.selectedWord; dndState.bank = dndState.bank.filter(w => w !== dndState.selectedWord); dndState.selectedWord = null; reRenderDnD(); }
        }

        function reRenderDnD() {
            let progressHtml = `
                <div class="flex justify-between items-center border-b-2 border-indigo-100 pb-4 shrink-0">
                    <div class="flex items-center gap-2 font-bold text-indigo-600">
                        <i data-lucide="pie-chart" class="w-5 h-5"></i> Math Genius
                    </div>
                    <span class="font-bold text-indigo-500 bg-indigo-100 px-3 py-1 rounded-full text-sm">
                        Q ${currentQuestionIndex + 1} / ${quizData.length}
                    </span>
                </div>
            `;
            renderDnD(progressHtml, quizData[currentQuestionIndex]);
        }

        window.checkDnD = function() {
            if(isAnswering) return;
            isAnswering = true;
            let allCorrect = true; dndState.slots.forEach(slot => { if (slot.filledWith !== slot.correctTerm) allCorrect = false; });
            
            userAnswers.push({ q: "Interactive Matching", correct: allCorrect, exp: allCorrect ? "Flawless matching!" : "Check the mark scheme to see the correct answers!" });
            document.getElementById('hint-btn')?.classList.add('hidden');

            const footer = document.getElementById('dnd-footer');
            if (allCorrect) {
                score++; playSound('correct');
                footer.innerHTML = `<div class="p-4 rounded-xl border-2 bg-green-50 border-green-300 animate-pop-in"><p class="font-bold text-green-700 flex items-center gap-2"><i data-lucide="check-circle" class="w-5 h-5"></i> Perfect Matches!</p></div>`;
            } else {
                playSound('incorrect');
                footer.innerHTML = `<div class="p-4 rounded-xl border-2 bg-red-50 border-red-300 animate-pop-in"><p class="font-bold text-red-700 flex items-center gap-2"><i data-lucide="x-circle" class="w-5 h-5"></i> Some matches were mixed up!</p></div>`;
                const dropSlots = document.querySelectorAll('.drop-slot');
                dndState.slots.forEach((slot, i) => {
                    if(slot.filledWith !== slot.correctTerm) { dropSlots[i].classList.add('border-red-400', 'bg-red-50'); dropSlots[i].querySelector('span').classList.replace('text-indigo-600', 'text-red-600'); }
                    else { dropSlots[i].classList.add('border-green-400', 'bg-green-50'); dropSlots[i].querySelector('span').classList.replace('text-indigo-600', 'text-green-600'); }
                });
            }
            lucide.createIcons(); setTimeout(nextQuestion, 4000);
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) { currentQuestionIndex++; renderQuestion(); } 
            else { renderEndScreen(); }
        }

        // --- END SCREEN ---
        function renderEndScreen() {
            let message = score === quizData.length ? "Flawless victory! You are a Math Queen! 👑✨" : "Great practice! Review the marks below! 🧮";
            
            let reportHtml = userAnswers.map((ans, i) => `
                <div class="bg-gray-50 p-3 rounded-xl border-2 ${ans.correct ? 'border-green-200' : 'border-red-200'} mb-3 text-left">
                    <p class="font-bold text-indigo-900 text-sm mb-1 flex gap-1"><span class="${ans.correct ? 'text-green-500' : 'text-red-500'}">${ans.correct ? '✅' : '❌'}</span> Q${i + 1}: ${ans.q}</p>
                    <p class="text-xs text-indigo-700 italic bg-white p-2 rounded-lg border border-gray-100"><strong>Mark Scheme:</strong> ${ans.exp}</p>
                </div>
            `).join('');

            root.innerHTML = `
                <div class="flex flex-col h-full w-full animate-pop-in">
                    <div class="text-center mb-4 shrink-0 no-print">
                        <div class="w-16 h-16 mx-auto bg-indigo-100 rounded-full flex items-center justify-center mb-2 shadow-sm"><i data-lucide="award" class="w-8 h-8 text-yellow-500"></i></div>
                        <h3 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500">Puzzles Complete!</h3>
                    </div>

                    <!-- Print Title (Only shows when printing) -->
                    <div class="hidden print:block text-center mb-6 border-b-2 border-indigo-200 pb-2">
                        <h2 class="text-2xl font-black text-indigo-600">Ayosh's Probability Report 🎀</h2>
                    </div>

                    <div class="bg-purple-50 w-full p-3 rounded-2xl border-2 border-purple-200 text-center mb-4 shrink-0">
                        <p class="text-sm text-purple-800 font-bold">Score: <span class="text-2xl text-purple-600">${score}/${quizData.length}</span></p>
                        <p class="text-xs text-purple-600 italic mt-1">${message}</p>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto custom-scrollbar pr-2 mb-4">
                        <h4 class="font-bold text-gray-500 text-xs uppercase tracking-wider mb-2 text-left">Detailed Review:</h4>
                        ${reportHtml}
                    </div>
                    
                    <div class="shrink-0 flex gap-4 no-print">
                        <button onclick="startGame()" class="flex-1 py-4 bg-gradient-to-r from-indigo-400 to-purple-400 hover:from-indigo-500 hover:to-purple-500 text-white rounded-2xl font-bold shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2">
                            <i data-lucide="refresh-ccw" class="w-5 h-5"></i> Retake
                        </button>
                        <button onclick="window.print()" class="flex-1 py-4 bg-white border-2 border-indigo-200 hover:bg-indigo-50 text-indigo-600 rounded-2xl font-bold shadow-sm transform transition active:scale-95 flex items-center justify-center gap-2 text-center">
                            <i data-lucide="printer" class="w-5 h-5"></i> Save Report
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        renderStart();
    </script>
</body>
</html>
